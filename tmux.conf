# unbind previous config
#unbind-key -a

set-window-option -g xterm-keys on

set -g base-index 1
setw -g pane-base-index 1

# Use Alt + Arrow keys for pane navigation
#bind -n M-<  select-pane -L  # Alt+Shift+,
#bind -n M->  select-pane -R  # Alt+Shift+.

# Use Alt + , and Alt + . to switch windows
bind -n M-, previous-window
bind -n M-. next-window

# Use Alt Shift , and Alt Shift . to switch sessions
#bind-key -n M-< switch-client -p
#bind-key -n M-> switch-client -n
# For some reason switching sessions doesn't always update the status bar, so explicitely do so
bind-key -n M-< run-shell "tmux switch-client -p; tmux refresh-client -S"
bind-key -n M-> run-shell "tmux switch-client -n; tmux refresh-client -S"


bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.tmux.conf reloaded"

bind-key -n M-s choose-tree -s

# Closing a session's last window snaps the client to the previous session in the
# list (matches the session row in the status bar) instead of detaching to iterm.
set -g detach-on-destroy previous

# Mirror the current session:window into the terminal's GUI window title, so
# window switchers (aerospace, cmd-tab) can find tmux windows by name.
set -g set-titles on
set -g set-titles-string "#S:#W"

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Ensure UTF-8 is used
#set -g utf8 on
#set -g status-utf8 on

#--- STATUS BAR ---#

# Set status bar on and position at the bottom
set -g status on
set -g status-position bottom

# Set colors for the status bar
set -g status-style bg=default,fg=colour244 # bg=default lets the terminal's background show through

# Set alignment of window list
set -g status-justify left

# LEFT side of status bar
set -g status-left-length "100"
set -g status-left-style default
set -g status-left "#[fg=green,bold]❐ #S #[default]" # Session name with an icon

# RIGHT side of status bar
set -g status-right-length "100"
set -g status-right-style default
set -g status-right "#[fg=cyan,bold]%H:%M %d-%b-%y#[default]" # Time and Date

# Second row - session list
set -g status 2
#set -g status-format[1] '#(tmux ls -F "##{session_id} ##S ##{?session_attached,is_active,}" | sed "s/^\\$//g" | sort -n | awk "{  if (\$3) { printf \"#[fg=white,bg=colour236,bold]\" }; printf \" \" NR-1 \":\"; printf substr(\$2, 1, 12) \" #[default]\" }" | tr "\n" " ")'
set -g status-format[1] '#(tmux ls -F "##S ##{?session_attached,is_active,}" | awk "{  if (\$2) { printf \"#[fg=white,bg=colour236,bold]\" }; printf \" \" NR-1 \":\"; printf substr(\$1, 1, 12) \" #[default]\" }" | tr "\n" " ")'

# Current (active) window style
set -g window-status-current-style fg=white,bg=colour236,bold
set -g window-status-current-format " #I:#W#F "

# Inactive window style. The @cl window option is stamped by claude-tmux-hook (bin/):
# orange = agent busy, red = agent needs you, green = agent done and unseen.
set -g window-status-style fg=colour244,bg=default
set -g window-status-format "#{?#{==:#{@cl},needs},#[fg=red bold],#{?#{==:#{@cl},done},#[fg=green bold],#{?#{==:#{@cl},busy},#[fg=colour214],}}} #I:#W#F #[default]"

# Seen it = no longer news: visiting a window clears its needs/done stamp (busy stays).
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{@cl},done},#{==:#{@cl},needs}}" "set-window-option -q @cl \"\""'

# Remove the separator between windows for a "tab" look
set -g window-status-separator ""

# Highlight activity in background windows
setw -g monitor-activity on
set -g visual-activity on

#--- END STATUS BAR ---#

# Fix for some escape sequence issues
set-option -ga terminal-overrides ",xterm-256color:Tc"

# stop tmux holding onto escape key so vim gets it immediately
set -s escape-time 0

# easy scrolling
bind -n M-Pageup copy-mode -u
set -g mouse on

# Pass terminal focus in/out through to the running program. nvim needs this
# for FocusGained, which is what makes it notice a file edited outside the
# editor instead of sitting on a stale buffer and overwriting the changes.
set -g focus-events on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# stop vim deleting lines with ctrl-arrows
set -g default-terminal "xterm-256color"
set-window-option -g xterm-keys on

# reordering windows
#bind-key -n C-[ swap-window -t -1 # can't do this because that binds escape inside vim for some reason...
bind-key -n C-] swap-window -t +1

set -g pane-border-status top

set-option -g history-limit 10000

#--- COPY MODE ---#

# Enter copy mode with Prefix + [
# Use vi keybindings for navigation and selection
setw -g mode-keys vi

# Start selection with 'v' (like Vim's visual mode)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# Copy selection with 'y' (like Vim's yank)
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel

# Press Prefix + e to Find the last error
# This enters copy mode, then executes a backward search for the string "error".
bind-key e copy-mode \; send-keys -X search-backward "error"


# tmux plugins
# requires <prefix> C-I to actually install
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Restored panes come back with their scrollback instead of blank.
set -g @resurrect-capture-pane-contents 'on'
# Restore vim/nvim with their session when a Session.vim exists (pair with tpope/vim-obsession).
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
# Restore claude launchers started via scripts/cl: the saved command line `cl <uuid>` re-runs
# after a server death, and cl resumes the conversation by that uuid (see scripts/cl).
set -g @resurrect-processes '"~scripts/cl"'

# run plugin manager. requires
# git clone https://github.com/tmux-plugins/tpm ~/config/tmux/plugins/tpm
run '~/.config/tmux/plugins/tpm/tpm'

# --- nested-tmux passthrough (added 2026-08-22) ------------------------
# F12 toggles passthrough: this tmux stops listening entirely so every
# key reaches a nested tmux. The bar goes dusty rose and says so. F12
# brings it back. Same block on Mac and VM so the sessions stay
# symmetric; whichever tmux is OUTER is the one F12 talks to.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=colour174,fg=colour52" \;\
  set status-left "#[bold] PASSTHROUGH #S " \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  refresh-client -S
# ----------------------------------------------------------------------
